apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: securedesk-default-deny
  namespace: securedesk
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: securedesk-allow-required
  namespace: securedesk
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: securedesk
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 5000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
