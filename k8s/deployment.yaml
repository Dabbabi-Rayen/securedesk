apiVersion: apps/v1
kind: Deployment
metadata:
  name: securedesk
  namespace: securedesk
  labels:
    app.kubernetes.io/name: securedesk
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: securedesk
  template:
    metadata:
      labels:
        app.kubernetes.io/name: securedesk
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: securedesk
          image: securedesk:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: securedesk-secrets
                  key: SECRET_KEY
            - name: DATABASE
              value: /app/instance/securedesk.sqlite
          volumeMounts:
            - name: data
              mountPath: /app/instance
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: securedesk-data
        - name: tmp
          emptyDir:
            medium: Memory
