apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: monitoring
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki.monitoring.svc.cluster.local:3100
        isDefault: true
        jsonData:
          maxLines: 1000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: monitoring
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: securedesk
        folder: Secure Desk
        type: file
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-securedesk
  namespace: monitoring
data:
  securedesk.json: |
    {
      "title": "Secure Desk – Security Events",
      "uid": "securedesk-security",
      "schemaVersion": 38,
      "refresh": "10s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "Security event stream",
          "type": "logs",
          "gridPos": { "x": 0, "y": 0, "w": 24, "h": 8 },
          "datasource": { "type": "loki", "uid": "loki" },
          "targets": [
            {
              "expr": "{namespace=\"securedesk\"}",
              "refId": "A"
            }
          ],
          "options": {
            "showTime": true,
            "wrapLogMessage": true,
            "prettifyLogMessage": true
          }
        },
        {
          "id": 2,
          "title": "Login failures",
          "type": "logs",
          "gridPos": { "x": 0, "y": 8, "w": 12, "h": 7 },
          "datasource": { "type": "loki", "uid": "loki" },
          "targets": [
            {
              "expr": "{namespace=\"securedesk\"} |= `auth.login_failed`",
              "refId": "A"
            }
          ],
          "options": { "showTime": true, "wrapLogMessage": true }
        },
        {
          "id": 3,
          "title": "Access denied / IDOR attempts",
          "type": "logs",
          "gridPos": { "x": 12, "y": 8, "w": 12, "h": 7 },
          "datasource": { "type": "loki", "uid": "loki" },
          "targets": [
            {
              "expr": "{namespace=\"securedesk\"} |= `ticket.access_denied`",
              "refId": "A"
            }
          ],
          "options": { "showTime": true, "wrapLogMessage": true }
        },
        {
          "id": 4,
          "title": "CSRF rejections",
          "type": "logs",
          "gridPos": { "x": 0, "y": 15, "w": 12, "h": 7 },
          "datasource": { "type": "loki", "uid": "loki" },
          "targets": [
            {
              "expr": "{namespace=\"securedesk\"} |= `csrf.rejected`",
              "refId": "A"
            }
          ],
          "options": { "showTime": true, "wrapLogMessage": true }
        },
        {
          "id": 5,
          "title": "Suspicious search (SQLi probes)",
          "type": "logs",
          "gridPos": { "x": 12, "y": 15, "w": 12, "h": 7 },
          "datasource": { "type": "loki", "uid": "loki" },
          "targets": [
            {
              "expr": "{namespace=\"securedesk\"} |= `ticket.search_suspicious`",
              "refId": "A"
            }
          ],
          "options": { "showTime": true, "wrapLogMessage": true }
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:11.0.0
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: "Viewer"
            - name: GF_AUTH_DISABLE_LOGIN_FORM
              value: "false"
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "securedesk-grafana"
            - name: GF_PATHS_PROVISIONING
              value: /etc/grafana/provisioning
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboards-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboard-securedesk
              mountPath: /var/lib/grafana/dashboards
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboards-provider
          configMap:
            name: grafana-dashboards-provider
        - name: dashboard-securedesk
          configMap:
            name: grafana-dashboard-securedesk
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
spec:
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
  type: ClusterIP
