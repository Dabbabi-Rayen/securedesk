{% extends "base.html" %}
{% block title %}Create account · Secure Desk{% endblock %}
{% block content %}
<section class="card form-card auth-card">
  <a class="back" href="{{ url_for('web.login') }}">← Client sign in</a>
  <p class="eyebrow">Client access</p>
  <h1>Create your account</h1>
  <p class="subheading">Open and follow your support requests from one place.</p>
  <form method="post">
    <label for="username">Username</label>
    <input id="username" name="username" minlength="3" required autofocus placeholder="choose a username">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" minlength="8" required placeholder="at least 8 characters">
    <label for="confirmation">Confirm password</label>
    <input id="confirmation" name="confirmation" type="password" minlength="8" required>
    <button class="full-button" type="submit">Create account <span>→</span></button>
  </form>
</section>
{% endblock %}
