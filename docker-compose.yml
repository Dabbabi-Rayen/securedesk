services:
  securedesk:
    build:
      context: .
      target: runtime
    ports:
      - "5000:5000"
    environment:
      FLASK_DEBUG: "0"
    volumes:
      - securedesk-data:/app/instance
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  securedesk-data:
