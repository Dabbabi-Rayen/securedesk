stages:
  - test
  - sast
  - secrets
  - dependencies
  - image

default:
  interruptible: true

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  DOCKER_HOST: "tcp://docker:2376"
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_TLS_VERIFY: "1"
  DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
  IMAGE_NAME: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/pip

unit-tests:
  stage: test
  image: python:3.12-slim
  script:
    - pip install --requirement requirements-dev.txt
    - mkdir --parents reports
    - pytest --junitxml=reports/pytest.xml
  artifacts:
    when: always
    reports:
      junit: reports/pytest.xml

semgrep:
  stage: sast
  image: semgrep/semgrep:latest
  script:
    - semgrep scan --config p/python --error --json --output semgrep-report.json app
  artifacts:
    when: always
    paths:
      - semgrep-report.json

gitleaks:
  stage: secrets
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  script:
    - gitleaks detect --source . --no-banner --redact --verbose

trivy-filesystem:
  stage: dependencies
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --no-progress .

container-scan:
  stage: image
  image: docker:27-cli
  services:
    - name: docker:27-dind
      command: ["--tls=true"]
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build --target runtime --tag "$IMAGE_NAME" .
    - docker push "$IMAGE_NAME"
    - docker save "$IMAGE_NAME" --output image.tar
    - docker run --rm -v "$CI_PROJECT_DIR:/workspace" aquasec/trivy:latest image --input /workspace/image.tar --severity HIGH,CRITICAL --exit-code 1 --no-progress
  rules:
    - if: '$CI_COMMIT_BRANCH'
